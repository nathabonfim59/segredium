name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - run: make packages
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v "$" {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "segredium $GITHUB_REF_NAME" --notes "${notes:-segredium $GITHUB_REF_NAME}" --verify-tag
